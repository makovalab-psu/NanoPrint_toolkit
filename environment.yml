name: nanoprint
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Workflow engine
  - snakemake

  # Alignment and BAM processing
  - samtools
  - minimap2
  - seqtk

  # Genomic interval tools
  - bedtools
  - ucsc-bedgraphtobigwig
  - ucsc-bigwigtobedgraph

  # Text processing utilities
  - gawk
  - bc

  # Python
  - python>=3.8
  - pysam
  # numpy<2 is what ont-remora requires (remora backend of ^mod-calls). Nothing in
  # the toolkit needs numpy 2; pandas is no longer used by any script and is kept
  # only as a utility, so it does not constrain this.
  - numpy<2
  - pandas

  # Pore model signal alignment (pod5 mode)
  # dorado: download binary from https://github.com/nanoporetech/dorado/releases
  #   (GPU basecaller; not on conda)
  #
  # After conda env create, install uncalled4 and pod5 via pip:
  #   pip install setuptools==69.5.1        # required — newer setuptools breaks uncalled4 build
  #   pip install uncalled4
  #   pip install pod5
  #
  # KNOWN HAZARD, currently unpinnable: in js4007 (2026-03-25) lib-pod5 >=0.3.33 with
  # pyarrow >=20 deadlocked inside uncalled4's C extension while reading POD5 signal —
  # an indefinite hang, no error message, no crash.
  # The old remedy pinned pod5==0.3.10 + pyarrow<15. That no longer installs: lib-pod5
  # 0.3.10 is not on PyPI, and current pod5 requires pyarrow >=20, so the pin is not
  # satisfiable (js4026, 2026-08-24 — nanoprint2 resolves to pyarrow 22).
  # It did NOT reproduce in js4022 (Sep 2026): `nanoprint preprocess` on hermes ran
  # `uncalled4 align` over 1690 pod5 files / 27.7 M reads to completion, reading POD5
  # signal throughout. That is strong evidence the deadlock is gone -- but the pyarrow
  # version in that hermes env was never recorded, so it is not proof for a fresh env.
  # On the first pod5 run in a new env, watch for uncalled4 sitting near 0% CPU
  # producing no output; if it hangs that way, this is the cause. Note that near-zero
  # CPU on the MAIN uncalled4 process is normal (workers do the DTW) -- check the child
  # processes and whether the output BAM is still growing before concluding it hung.
  # Only POD5 reading is affected — `uncalled4 convert` on an existing Uncalled4 BAM
  # reads DTW tags and never opens a pod5.

  # Direct modification calling, remora backend only (^mod-calls remora):
  #   pip install ont-remora==3.3.0     # the version the backend was written against
  # It pulls torch, polars and parasail, and requires numpy<2 (pinned above).
  # The uncalled4 backend needs nothing beyond uncalled4 itself.

  # R and packages
  - r-base
  - r-ggplot2
  - r-dplyr
  - r-gridextra
